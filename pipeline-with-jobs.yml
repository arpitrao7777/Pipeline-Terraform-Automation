pool: testpool

trigger: none

jobs:
  - job: terraforminitandplan
    displayName: Terraform Init And Plan
    pool: testpool
    steps:
    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'testingpool'
        backendAzureRmResourceGroupName: 'rg-001'
        backendAzureRmStorageAccountName: 'test32971'
        backendAzureRmContainerName: 'developement'
        backendAzureRmKey: 'main.terraform.tfstate'

    - task: TerraformTask@5
      displayName: Terraform Plan
      inputs:
        provider: 'azurerm'
        command: 'plan'
        environmentServiceNameAzureRM: 'testingpool'

  - job: manualvalidation
    dependsOn: terraforminitandplan
    displayName: Manual Validation
    pool: server
    steps:
    - task: ManualValidation@1
      displayName: Manual Validation
      inputs:
        notifyUsers: 'arpit39115@gmail.com'
        instructions: 'Please review it'

  - job: terraformapply
    dependsOn: manualvalidation
    displayName: Terraform Apply
    pool: testpool
    steps:
    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: 'testingpool'
        backendAzureRmResourceGroupName: 'rg-001'
        backendAzureRmStorageAccountName: 'test32971'
        backendAzureRmContainerName: 'developement'
        backendAzureRmKey: 'main.terraform.tfstate'

    - task: TerraformTask@5
      displayName: Terraform Apply
      inputs:
        provider: 'azurerm'
        command: 'apply'
        environmentServiceNameAzureRM: 'testingpool'