pool: testpool

trigger: none

variables:
  Work_dir: '$(System.DefaultWorkingDirectory)/infracode'

stages:
  - stage: terraforminitandplan
    displayName: Terraform init and Plan
    jobs:
      - job: terraforminitandplan
        displayName: Terraform init and Plan
        steps:  
        - task: tfsec@1
          condition: Always()
          inputs:
            version: 'v1.26.0'
            dir: '$(System.DefaultWorkingDirectory)/infracode'

        - task: CmdLine@2
          condition: Always()
          displayName: TfLint
          inputs:
            script: 'tflint --chdir=. --format=junit > $(System.DefaultWorkingDirectory)/tflint_report.xml'
            workingDirectory: '$(System.DefaultWorkingDirectory)/infracode'

        - task: CmdLine@2
          condition: Always()
          displayName: Checkov
          inputs:
            script: 'checkov -d . -o junitxml --output-file-path $(System.DefaultWorkingDirectory)/'
            workingDirectory: '$(System.DefaultWorkingDirectory)/infracode'

        - task: PublishTestResults@2
          condition: Always()
          inputs:
            testResultsFormat: 'JUnit'
            testResultsFiles: ' *.xml'
            searchFolder: '$(System.DefaultWorkingDirectory)'
            testRunTitle: 'Checkov'

        - task: TerraformTask@5
          displayName: Terraform Init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(Work_dir)'
            backendServiceArm: 'testingpool'
            backendAzureRmResourceGroupName: 'rg-001'
            backendAzureRmStorageAccountName: 'test32971'
            backendAzureRmContainerName: 'developement'
            backendAzureRmKey: 'main.terraform.tfstate'

        - task: TerraformTask@5
          displayName: Terraform Plan
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(Work_dir)'
            environmentServiceNameAzureRM: 'testingpool'

  - stage: manualvalidationandterraformapply
    displayName: Manual Validation And Terraform Apply
    jobs:
      - job: manualvalidation
        pool: server
        displayName: Manual Validation
        steps: 
        - task: ManualValidation@1
          displayName: Manual Validation
          inputs:
            notifyUsers: 'arpit39115gmail.com'
            instructions: 'Please Review it'

      - job: terraformapply
        displayName: Terraform Apply
        steps:
        - task: TerraformTask@5
          displayName: Terraform Init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(Work_dir)'
            backendServiceArm: 'testingpool'
            backendAzureRmResourceGroupName: 'rg-001'
            backendAzureRmStorageAccountName: 'test32971'
            backendAzureRmContainerName: 'developement'
            backendAzureRmKey: 'main.terraform.tfstate'

        - task: TerraformTask@5
          displayName: Terraform Apply
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(Work_dir)'
            environmentServiceNameAzureRM: 'testingpool'